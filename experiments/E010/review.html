<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLB-200 E010 Review</title>
<style>
:root{--ink:#17212b;--muted:#61707d;--line:#d9e0e5;--paper:#f7f9fa;--use:#19734a;--amb:#a36b00;--disq:#a63d40}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#e3f1f4 0,transparent 34%),var(--paper);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif}main{width:min(900px,100%);margin:auto;padding:32px 18px 48px}header{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:24px}h1{margin:0;font-size:clamp(28px,5vw,46px);line-height:1.05}.progress,.meta,.hint{color:var(--muted);font-size:14px}.panel{background:#fff;border:1px solid var(--line);padding:22px;box-shadow:0 12px 32px #20313d12}.meta{margin-bottom:18px}audio{display:block;width:100%;margin:14px 0 22px}.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font:700 16px Georgia,"Times New Roman",serif;padding:12px 14px}button.selected{color:#fff}button[data-v="Use"].selected{background:var(--use);border-color:var(--use)}button[data-v="Ambiguous"].selected{background:var(--amb);border-color:var(--amb)}button[data-v="Disq"].selected{background:var(--disq);border-color:var(--disq)}label{display:block;margin:18px 0 6px;font-weight:700}select,textarea{width:100%;padding:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:16px Georgia,"Times New Roman",serif}textarea{min-height:88px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}.actions button{background:var(--ink);color:#fff;border-color:var(--ink)}.actions .secondary{background:transparent;color:var(--ink)}.hint{margin-top:18px}@media(max-width:560px){header{display:block}.progress{margin-top:10px}.verdicts{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1/-1}}
</style>
</head>
<body><main><header><h1>SLB-200 E010 Review</h1><div class="progress" id="progress">Loading...</div></header><section class="panel"><div class="meta" id="meta"></div><audio id="audio" controls preload="metadata"></audio><div class="verdicts"><button data-v="Use">Use</button><button data-v="Ambiguous">Ambiguous</button><button data-v="Disq">Disq</button></div><label for="reason">Reason</label><select id="reason"><option value="">Select a reason...</option><option value="silence_or_near_silence">Silence / near-silence</option><option value="unpitched_noise">Unpitched noise</option><option value="merged_sequential_notes">Merged sequential notes</option><option value="polyphony_or_double_stop">Polyphony / double stop</option><option value="bad_boundary_or_fragment">Bad boundary / fragment</option><option value="tail_of_previous_note">Tail of previous note</option><option value="clipping_or_artifact">Clipping / recording artifact</option><option value="other">Other</option></select><label for="articulation">Articulation</label><select id="articulation"><option value="">Select articulation...</option><option value="stable_single_note">Stable single note</option><option value="pizzicato">Pizzicato</option><option value="arco">Arco</option><option value="vibrato">Vibrato</option><option value="glissando">Glissando</option><option value="hammer_on">Hammer-on / secondary note</option></select><label for="note">Annotation</label><textarea id="note" placeholder="Optional detail..."></textarea><div class="actions"><button class="secondary" id="prev">Previous</button><button class="secondary" id="skip">Skip</button><button id="next">Next</button><button id="export">Export CSV</button></div><div class="hint">E010 has an independent review state. Automatic Disq means a fragment too short to represent a complete bass note, or a short low-level nonperiodic fragment. 1/2/3 set verdict; Enter advances; Space plays/pauses.</div></section></main>
<script>
const key="slb200-e010-review-v1",saved=JSON.parse(localStorage.getItem(key)||"{}"),audio=document.getElementById("audio"),meta=document.getElementById("meta"),progress=document.getElementById("progress"),note=document.getElementById("note"),reason=document.getElementById("reason"),articulation=document.getElementById("articulation");let samples=[],index=Number(saved.index||0);
function persist(){localStorage.setItem(key,JSON.stringify(saved))}function eventKey(){return String(samples[index].event)}function capture(){if(!samples.length)return;saved[eventKey()]={...(saved[eventKey()]||{}),note:note.value,reason:reason.value,articulation:articulation.value};persist()}function render(){if(!samples.length)return;const sample=samples[index],decision=saved[eventKey()]||{},verdict=decision.verdict||(sample.quality_status==="disqualified"?"Disq":"");audio.src=sample.file;audio.load();meta.textContent=`event ${sample.event} | ${Number(sample.start_s).toFixed(3)}-${Number(sample.end_s).toFixed(3)} s | ${Number(sample.duration_s).toFixed(3)} s | peak ${Number(sample.peak_db).toFixed(1)} dB | ${sample.quality_status} | periodic frames ${Math.round(Number(sample.tonal_frame_fraction)*100)}%`;note.value=decision.note||(sample.quality_status==="disqualified"?sample.quality_reason:"");reason.value=decision.reason||(sample.quality_status==="disqualified"?"bad_boundary_or_fragment":"");articulation.value=decision.articulation||"";document.querySelectorAll("[data-v]").forEach(button=>button.classList.toggle("selected",button.dataset.v===verdict));const judged=samples.filter(item=>saved[String(item.event)]?.verdict||item.quality_status==="disqualified").length;progress.textContent=`${index+1} / ${samples.length} | judged ${judged}`;saved.index=index;persist()}function setVerdict(value){capture();saved[eventKey()]={...(saved[eventKey()]||{}),verdict:value};persist();render()}function move(step){capture();index=Math.max(0,Math.min(samples.length-1,index+step));audio.pause();render()}function exportCsv(){const rows=[["event","start_s","end_s","duration_s","peak_db","tonal_frame_fraction","quality_status","verdict","reason","articulation","annotation","file"],...samples.map(sample=>{const decision=saved[String(sample.event)]||{};return[sample.event,sample.start_s,sample.end_s,sample.duration_s,sample.peak_db,sample.tonal_frame_fraction,sample.quality_status,decision.verdict||(sample.quality_status==="disqualified"?"Disq":""),decision.reason||"",decision.articulation||"",decision.note||sample.quality_reason||"",sample.file]})];const csv=rows.map(row=>row.map(value=>`"${String(value).replaceAll('"','""')}"`).join(",")).join("\n"),link=document.createElement("a");link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));link.download="slb200_e010_review.csv";link.click()}
fetch("manifest.json").then(response=>response.json()).then(data=>{samples=data;render()}).catch(error=>{progress.textContent="Could not load E010 manifest";console.error(error)});document.querySelectorAll("[data-v]").forEach(button=>button.onclick=()=>setVerdict(button.dataset.v));reason.onchange=()=>{if(["silence_or_near_silence","unpitched_noise","clipping_or_artifact"].includes(reason.value))saved[eventKey()]={...(saved[eventKey()]||{}),verdict:"Disq"};capture();render()};articulation.onchange=capture;note.oninput=capture;document.getElementById("prev").onclick=()=>move(-1);document.getElementById("skip").onclick=()=>move(1);document.getElementById("next").onclick=()=>move(1);document.getElementById("export").onclick=exportCsv;document.onkeydown=event=>{if(event.target===note||!samples.length)return;if(event.code==="Space"){event.preventDefault();audio.paused?audio.play():audio.pause()}if(event.key==="1")setVerdict("Use");if(event.key==="2")setVerdict("Ambiguous");if(event.key==="3")setVerdict("Disq");if(event.key==="Enter")move(1)};
</script></body></html>
