<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLB-200 Event Review</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #61707d;
      --line: #d9e0e5;
      --paper: #f7f9fa;
      --panel: #ffffff;
      --accent: #0c6e8f;
      --use: #19734a;
      --ambiguous: #a36b00;
      --disq: #a63d40;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #e3f1f4 0, transparent 34%), var(--paper);
      color: var(--ink);
      font: 16px/1.45 Georgia, "Times New Roman", serif;
    }
    main { width: min(920px, 100%); margin: 0 auto; padding: 32px 18px 48px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 24px; }
    h1 { margin: 0; font: 700 clamp(28px, 5vw, 48px)/1.05 Georgia, "Times New Roman", serif; letter-spacing: 0; }
    .progress { color: var(--muted); white-space: nowrap; }
    .panel { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); padding: 22px; box-shadow: 0 12px 32px #20313d12; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    audio { display: block; width: 100%; margin: 14px 0 22px; }
    .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button { border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; font: 700 16px Georgia, "Times New Roman", serif; padding: 12px 14px; }
    button:hover { border-color: var(--accent); }
    button.selected { color: white; }
    button[data-verdict="Use"].selected { background: var(--use); border-color: var(--use); }
    button[data-verdict="Ambiguous"].selected { background: var(--ambiguous); border-color: var(--ambiguous); }
    button[data-verdict="Disq"].selected { background: var(--disq); border-color: var(--disq); }
    label { display: block; margin: 22px 0 7px; font-weight: 700; }
    textarea { width: 100%; min-height: 100px; resize: vertical; border: 1px solid var(--line); padding: 12px; color: var(--ink); background: #fff; font: 16px/1.4 Georgia, "Times New Roman", serif; }
    .actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 20px; }
    .actions button { background: var(--ink); color: white; border-color: var(--ink); }
    .actions .secondary { background: transparent; color: var(--ink); }
    .hint { color: var(--muted); font-size: 14px; margin-top: 18px; }
    @media (max-width: 560px) {
      header { display: block; }
      .progress { margin-top: 10px; }
      .verdicts { grid-template-columns: 1fr; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .actions button:last-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>SLB-200 Event Review</h1>
    <div class="progress" id="progress">Loading...</div>
  </header>
  <section class="panel">
    <div class="meta" id="meta"></div>
    <audio id="player" controls preload="metadata"></audio>
    <div class="verdicts" aria-label="Verdict">
      <button data-verdict="Use">Use</button>
      <button data-verdict="Ambiguous">Ambiguous</button>
      <button data-verdict="Disq">Disq</button>
    </div>
    <label for="note">Annotation</label>
    <textarea id="note" placeholder="Optional note: merged notes, silence, clean single note, boundary issue..."></textarea>
    <div class="actions">
      <button class="secondary" id="previous">Previous</button>
      <button class="secondary" id="skip">Skip</button>
      <button id="next">Next</button>
      <button id="export">Export CSV</button>
    </div>
    <div class="hint">Progress is saved in this browser. Keyboard: Space plays/pauses, 1 = Use, 2 = Ambiguous, 3 = Disq, Enter = Next.</div>
  </section>
</main>

const storageKey = "slb200-event-review-v1";
const state = JSON.parse(localStorage.getItem(storageKey) || "{}");
let index = Number(state.index || 0);
const player = document.getElementById("player");
const note = document.getElementById("note");
const meta = document.getElementById("meta");
const progress = document.getElementById("progress");
function save() { localStorage.setItem(storageKey, JSON.stringify(state)); }
function currentKey() { return String(samples[index].event); }
function render() {
  const sample = samples[index];
  const decision = state[currentKey()] || {};
  player.src = sample.file;
  player.load();
  meta.textContent = `${sample.category} | event ${sample.event} | ${sample.start.toFixed(3)}-${sample.end.toFixed(3)} s | duration ${sample.duration.toFixed(3)} s | peak ${sample.peak.toFixed(1)} dB | f0 ${sample.f0} Hz`;
  note.value = decision.note || "";
  document.querySelectorAll("[data-verdict]").forEach(button => button.classList.toggle("selected", button.dataset.verdict === decision.verdict));
  const judged = samples.filter(item => state[String(item.event)]?.verdict).length;
  progress.textContent = `${index + 1} / ${samples.length} | judged ${judged}`;
  state.index = index;
  save();
}
function setVerdict(verdict) { state[currentKey()] = { ...(state[currentKey()] || {}), verdict, note: note.value }; save(); render(); }
function move(step) { state[currentKey()] = { ...(state[currentKey()] || {}), note: note.value }; index = Math.max(0, Math.min(samples.length - 1, index + step)); player.pause(); render(); }
function exportCsv() {
  const rows = [["event","category","start_s","end_s","duration_s","peak_db","attack_s","median_f0_hz","verdict","annotation","file"]];
  samples.forEach(sample => { const decision = state[String(sample.event)] || {}; rows.push([sample.event,sample.category,sample.start,sample.end,sample.duration,sample.peak,sample.attack,sample.f0,decision.verdict || "",(decision.note || "").replaceAll('"','""'),sample.file]); });
  const csv = rows.map(row => row.map(value => `"${value}"`).join(",")).join("\n");
  const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); link.download = "slb200_event_review.csv"; link.click(); URL.revokeObjectURL(link.href);
}
document.querySelectorAll("[data-verdict]").forEach(button => button.addEventListener("click", () => setVerdict(button.dataset.verdict)));
note.addEventListener("input", () => { state[currentKey()] = { ...(state[currentKey()] || {}), note: note.value }; save(); });
document.getElementById("previous").addEventListener("click", () => move(-1));
document.getElementById("skip").addEventListener("click", () => move(1));
document.getElementById("next").addEventListener("click", () => move(1));
document.getElementById("export").addEventListener("click", exportCsv);
document.addEventListener("keydown", event => { if (event.target === note) return; if (event.code === "Space") { event.preventDefault(); player.paused ? player.play() : player.pause(); } if (event.key === "1") setVerdict("Use"); if (event.key === "2") setVerdict("Ambiguous"); if (event.key === "3") setVerdict("Disq"); if (event.key === "Enter") move(1); });
render();
