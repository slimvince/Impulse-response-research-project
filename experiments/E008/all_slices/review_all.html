<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLB-200 All Event Review</title>
<style>
:root{--ink:#17212b;--muted:#61707d;--line:#d9e0e5;--paper:#f7f9fa;--use:#19734a;--amb:#a36b00;--disq:#a63d40}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#e3f1f4 0,transparent 34%),var(--paper);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif}main{width:min(900px,100%);margin:auto;padding:32px 18px 48px}header{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:24px}h1{margin:0;font-size:clamp(28px,5vw,46px);line-height:1.05}.progress,.meta,.hint{color:var(--muted);font-size:14px}.panel{background:#fff;border:1px solid var(--line);padding:22px;box-shadow:0 12px 32px #20313d12}.meta{margin-bottom:18px}audio{display:block;width:100%;margin:14px 0 22px}.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font:700 16px Georgia,"Times New Roman",serif;padding:12px 14px}button.selected{color:#fff}button[data-v="Use"].selected{background:var(--use);border-color:var(--use)}button[data-v="Ambiguous"].selected{background:var(--amb);border-color:var(--amb)}button[data-v="Disq"].selected{background:var(--disq);border-color:var(--disq)}label{display:block;margin:22px 0 7px;font-weight:700}textarea{width:100%;min-height:100px;resize:vertical;padding:12px;border:1px solid var(--line);font:16px/1.4 Georgia,"Times New Roman",serif}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}.actions button{background:var(--ink);color:#fff;border-color:var(--ink)}.actions .secondary{background:transparent;color:var(--ink)}.hint{margin-top:18px}@media(max-width:560px){header{display:block}.progress{margin-top:10px}.verdicts{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1/-1}}
</style>
</head>
<body><main><header><h1>SLB-200 All Event Review</h1><div class="progress" id="progress">Loading...</div></header><section class="panel"><div class="meta" id="meta"></div><audio id="audio" controls preload="metadata"></audio><div class="verdicts"><button data-v="Use">Use</button><button data-v="Ambiguous">Ambiguous</button><button data-v="Disq">Disq</button></div><label for="reason">Reason</label><select id="reason"><option value="">Select a reason...</option><option value="silence_or_near_silence">Silence / near-silence</option><option value="unpitched_noise">Unpitched noise</option><option value="merged_sequential_notes">Merged sequential notes</option><option value="polyphony_or_double_stop">Polyphony / double stop</option><option value="bad_boundary_or_fragment">Bad boundary / fragment</option><option value="tail_of_previous_note">Tail of previous note</option><option value="attack_only_or_tail_only">Attack-only / tail-only</option><option value="pitch_uncertain">Pitch uncertain</option><option value="clipping_or_artifact">Clipping / recording artifact</option><option value="other">Other</option></select><label for="articulation">Articulation</label><select id="articulation"><option value="">Select articulation...</option><option value="stable_single_note">Stable single note</option><option value="pizzicato">Pizzicato</option><option value="arco">Arco</option><option value="vibrato">Vibrato</option><option value="glissando">Glissando</option><option value="hammer_on">Hammer-on / secondary note</option></select><label for="note">Annotation</label><textarea id="note" placeholder="Optional detail..."></textarea><div class="actions"><button class="secondary" id="prev">Previous</button><button class="secondary" id="skip">Skip</button><button id="next">Next</button><button id="export">Export CSV</button></div><div class="hint">Progress is saved in this browser. Space plays/pauses, 1/2/3 choose a verdict, Enter goes next.</div></section></main>
<script>
const key="slb200-all-event-review-v3", legacyKey="slb200-all-event-review-v2", legacy=JSON.parse(localStorage.getItem(legacyKey)||"{}"), priorAudit=JSON.parse(localStorage.getItem("slb200-event-review-v1")||"{}"), current=JSON.parse(localStorage.getItem(key)||"{}"), saved={}, audio=document.getElementById("audio"), note=document.getElementById("note"), meta=document.getElementById("meta"), progress=document.getElementById("progress");
function mergeState(source, removeAutomatic){Object.keys(source).forEach(item=>{if(item==="index")return;const incoming=source[item];if(removeAutomatic&&incoming.verdict==="Disq"&&String(incoming.note||"").startsWith("Automatic prelabel:"))return;saved[item]={...incoming,...(saved[item]||{})}})}
mergeState(priorAudit,false); mergeState(legacy,true); mergeState(current,false);
let samples=[], triage={}, index=Number(current.index ?? legacy.index ?? priorAudit.index ?? 0);
function render(){const s=samples[index],d=saved[id()]||{},t=triage[id()]||{};audio.src=s.file;audio.load();const pre=t.auto_verdict?` | automatic prelabel: ${t.auto_verdict} (${t.rationale})`:"";meta.textContent=`event ${s.event} | ${Number(s.start_s).toFixed(3)}-${Number(s.end_s).toFixed(3)} s | duration ${Number(s.duration_s).toFixed(3)} s | peak ${Number(s.peak_db).toFixed(1)} dB${pre}`;note.value=d.note||"";document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("selected",b.dataset.v===d.verdict));progress.textContent=`${index+1} / ${samples.length} | judged ${samples.filter(s=>saved[String(s.event)]?.verdict).length}`;saved.index=index;store()} function verdict(v){saved[id()]={...(saved[id()]||{}),verdict:v,note:note.value};store();render()} function move(n){saved[id()]={...(saved[id()]||{}),note:note.value};index=Math.max(0,Math.min(samples.length-1,index+n));audio.pause();render()} function exportCsv(){const rows=[["event","start_s","end_s","duration_s","peak_db","verdict","annotation","file"],...samples.map(s=>{const d=saved[String(s.event)]||{};return[s.event,s.start_s,s.end_s,s.duration_s,s.peak_db,d.verdict||"",d.note||"",s.file]})];const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="slb200_all_event_review.csv";a.click()}
function store(){localStorage.setItem(key,JSON.stringify(saved))} function id(){return String(samples[index].event)} function render(){const s=samples[index],d=saved[id()]||{};audio.src=s.file;audio.load();meta.textContent=`event ${s.event} | ${Number(s.start_s).toFixed(3)}-${Number(s.end_s).toFixed(3)} s | duration ${Number(s.duration_s).toFixed(3)} s | peak ${Number(s.peak_db).toFixed(1)} dB`;note.value=d.note||"";document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("selected",b.dataset.v===d.verdict));progress.textContent=`${index+1} / ${samples.length} | judged ${samples.filter(s=>saved[String(s.event)]?.verdict).length}`;saved.index=index;store()} function verdict(v){saved[id()]={...(saved[id()]||{}),verdict:v,note:note.value};store();render()} function move(n){saved[id()]={...(saved[id()]||{}),note:note.value};index=Math.max(0,Math.min(samples.length-1,index+n));audio.pause();render()} function exportCsv(){const rows=[["event","start_s","end_s","duration_s","peak_db","verdict","annotation","file"],...samples.map(s=>{const d=saved[String(s.event)]||{};return[s.event,s.start_s,s.end_s,s.duration_s,s.peak_db,d.verdict||"",d.note||"",s.file]})];const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="slb200_all_event_review.csv";a.click()}
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>verdict(b.dataset.v));note.oninput=()=>{saved[id()]={...(saved[id()]||{}),note:note.value};store()};document.getElementById("prev").onclick=()=>move(-1);document.getElementById("skip").onclick=()=>move(1);document.getElementById("next").onclick=()=>move(1);document.getElementById("export").onclick=exportCsv;document.onkeydown=e=>{if(e.target===note)return;if(e.code==="Space"){e.preventDefault();audio.paused?audio.play():audio.pause()}if(e.key==="1")verdict("Use");if(e.key==="2")verdict("Ambiguous");if(e.key==="3")verdict("Disq");if(e.key==="Enter")move(1)};
fetch("manifest.json").then(r=>r.json()).then(data=>{samples=data;render()}).catch(e=>{progress.textContent="Could not load manifest.json";console.error(e)});
Promise.all([fetch("manifest.json").then(r=>r.json()),fetch("../triage.json").then(r=>r.json())]).then(([data,judgments])=>{samples=data;triage=Object.fromEntries(judgments.map(row=>[String(row.event),row]));judgments.forEach(row=>{if(!saved[String(row.event)])saved[String(row.event)]={...(row.auto_verdict==="Disq"?{verdict:"Disq"}:{}),note:row.suggested_annotation}});render()}).catch(e=>{progress.textContent="Could not load manifest or triage data";console.error(e)});
const reasonControl=document.getElementById("reason"), articulationControl=document.getElementById("articulation");
function saveStructured(){if(!samples.length)return;saved[id()]={...(saved[id()]||{}),reason:reasonControl.value,articulation:articulationControl.value,note:note.value};store()}
function syncStructured(){if(!samples.length)return;const item=saved[id()]||{};reasonControl.value=item.reason||"";articulationControl.value=item.articulation||""}
reasonControl.onchange=()=>{if(["unpitched_noise","silence_or_near_silence","clipping_or_artifact"].includes(reasonControl.value))saved[id()]={...(saved[id()]||{}),verdict:"Disq"};saveStructured();render();syncStructured()}; articulationControl.onchange=saveStructured; note.oninput=saveStructured;
document.querySelectorAll("[data-v]").forEach(button=>button.onclick=()=>{saveStructured();verdict(button.dataset.v);syncStructured()});
document.getElementById("prev").onclick=()=>{saveStructured();move(-1);syncStructured()}; document.getElementById("skip").onclick=()=>{saveStructured();move(1);syncStructured()}; document.getElementById("next").onclick=()=>{saveStructured();move(1);syncStructured()};
document.getElementById("export").onclick=()=>{const rows=[["event","start_s","end_s","duration_s","peak_db","verdict","reason","articulation","annotation","file"],...samples.map(sample=>{const item=saved[String(sample.event)]||{};return[sample.event,sample.start_s,sample.end_s,sample.duration_s,sample.peak_db,item.verdict||"",item.reason||"",item.articulation||"",item.note||"",sample.file]})];const csv=rows.map(row=>row.map(value=>`"${String(value).replaceAll('"','""')}"`).join(",")).join("\n");const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));link.download="slb200_all_event_review.csv";link.click()};
setInterval(syncStructured,500);
</script></body></html>
