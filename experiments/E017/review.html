<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E017 Cubase Candidate Audit</title><style>
:root{color-scheme:light;--ink:#17212b;--muted:#61707d;--line:#d9e0e5;--paper:#f4f7f8;--panel:#fff;--accept:#19734a;--reject:#a63d40;--uncertain:#a36b00;--accent:#0c6e8f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0%,#dceff1,transparent 35%),var(--paper);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif}main{width:min(900px,100%);margin:auto;padding:30px 18px 44px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}h1{font-size:clamp(27px,5vw,42px);line-height:1.05;margin:0}.tag{font:700 12px/1.2 Arial,sans-serif;color:var(--accent);text-transform:uppercase}.status,.meta,.hint{font-size:14px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);padding:20px;box-shadow:0 12px 32px #20313d12}.meta{margin-bottom:12px}.suggestion{margin:10px 0;padding:10px 12px;background:#edf3f4;border-left:3px solid var(--accent);font-size:14px}audio{width:100%;margin:8px 0 2px}.source-info{font-size:13px;color:var(--muted)}.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}button{border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font:700 15px Georgia,serif;padding:11px 12px}.verdicts button.selected{color:white}.verdicts [data-v="usable"].selected{background:var(--accept);border-color:var(--accept)}.verdicts [data-v="unusable"].selected{background:var(--reject);border-color:var(--reject)}.verdicts [data-v="uncertain"].selected{background:var(--uncertain);border-color:var(--uncertain)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}select,textarea{width:100%;padding:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font:15px Georgia,serif}select[multiple]{height:132px}textarea{min-height:84px;resize:vertical}.actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:16px}.actions button{background:var(--ink);color:#fff;border-color:var(--ink)}.actions .secondary{background:transparent;color:var(--ink)}.hint{margin-top:14px}@media(max-width:640px){header{display:block}.status{margin-top:8px}.fields{grid-template-columns:1fr}.verdicts{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1/-1}}
</style></head><body><main><header><div><div class="tag">E017 · Human reference subset</div><h1>Cubase Candidate Audit</h1></div><div class="status" id="progress">Loading...</div></header><section class="panel"><div class="meta" id="meta"></div><div class="suggestion" id="suggestion"></div><label for="candidate">Candidate slice</label><audio id="candidate" controls preload="metadata"></audio><div class="source-info" id="source-info"></div><div class="verdicts" aria-label="Event validity"><button data-v="usable">Usable</button><button data-v="unusable">Unusable</button><button data-v="uncertain">Uncertain</button></div><div class="fields"><div><label for="reasons">Reason code(s), multiple allowed</label><select id="reasons" multiple><option value="clean_isolated_excitation">Clean isolated excitation</option><option value="silence_or_near_silence">Silence / near-silence</option><option value="unpitched_noise">Unpitched noise / handling transient</option><option value="multiple_excitation">Multiple sequential excitations</option><option value="possible_polyphony">Possible simultaneous voices / overlap</option><option value="onset_missing_or_late">Onset missing or late</option><option value="tail_or_decay_truncated">Tail / decay truncated</option><option value="bleed_from_neighbor">Bleed from adjacent event</option><option value="low_signal_or_snr">Low signal / poor SNR</option><option value="clipping_or_artifact">Clipping / recording artifact</option><option value="other">Other / explain in note</option></select></div><div><label for="f0">F0 feature reliability</label><select id="f0"><option value="not_assessed">Not assessed</option><option value="reliable">Reliable enough for this event</option><option value="weak">Weak / unstable</option><option value="unavailable">Unavailable</option></select><label for="confidence">Judgment confidence</label><select id="confidence"><option value="">Select confidence...</option><option value="1">1 · High</option><option value="2">2 · Medium</option><option value="3">3 · Low</option></select></div></div><label for="note">Annotation</label><textarea id="note" placeholder="What did you hear? Note count, boundary details, or why uncertain..."></textarea><div class="actions"><button class="secondary" id="previous">Previous</button><button class="secondary" id="skip">Skip</button><button id="next">Next</button><button id="export">Export CSV</button></div><div class="hint">Event validity and f0 reliability are separate. Cubase is a candidate generator, not ground truth. Progress autosaves in this browser; this E017 review state is independent from earlier audits.</div></section></main>
<script>
const KEY="cubase-validator-e017-v1",saved=JSON.parse(localStorage.getItem(KEY)||"{}"),candidate=document.getElementById("candidate"),meta=document.getElementById("meta"),suggestion=document.getElementById("suggestion"),progress=document.getElementById("progress"),sourceInfo=document.getElementById("source-info"),reasons=document.getElementById("reasons"),f0=document.getElementById("f0"),confidence=document.getElementById("confidence"),note=document.getElementById("note");let items=[],index=Number(saved.index||0);function save(){localStorage.setItem(KEY,JSON.stringify(saved))}function id(){return items[index].audit_id}function selectedReasons(){return [...reasons.selectedOptions].map(option=>option.value)}function capture(){if(!items.length)return;saved[id()]={...(saved[id()]||{}),verdict:saved[id()]?.verdict||"",reasons:selectedReasons(),f0_reliability:f0.value,confidence:confidence.value,note:note.value};save()}function render(){if(!items.length)return;const item=items[index],decision=saved[id()]||{};candidate.src=item.file;candidate.load();meta.textContent=`${index+1}/${items.length} · ${item.slice_set_id} · ${item.filename} · ${Number(item.duration_s).toFixed(3)} s · ${item.peak_dbfs===null?"peak unavailable":Number(item.peak_dbfs).toFixed(1)+" dBFS"}`;sourceInfo.textContent=item.source_available?"An unsplit source exists, but this export has no verified source-time position; source audio is not shown as an aligned comparison.":"Unsplit source unavailable for this slice set.";suggestion.textContent=`Validator suggestion: ${item.validator_suggestion} · ${item.validator_reasons.join("; ")||"no reasons"} · sampling stratum: ${item.sampling_stratum}`;const choices=new Set(decision.reasons||[]);[...reasons.options].forEach(option=>option.selected=choices.has(option.value));f0.value=decision.f0_reliability||"not_assessed";confidence.value=decision.confidence||"";note.value=decision.note||"";document.querySelectorAll("[data-v]").forEach(button=>button.classList.toggle("selected",button.dataset.v===(decision.verdict||"")));const judged=items.filter(x=>saved[x.audit_id]?.verdict).length;progress.textContent=`${index+1} / ${items.length} · judged ${judged}`;saved.index=index;save()}function setVerdict(value){capture();saved[id()]={...(saved[id()]||{}),verdict:value,reasons:selectedReasons(),f0_reliability:f0.value,confidence:confidence.value,note:note.value};save();render()}function move(step){capture();index=Math.max(0,Math.min(items.length-1,index+step));candidate.pause();render()}function exportCsv(){const fields=["audit_id","slice_set_id","candidate_id","filename","duration_s","validator_suggestion","validator_reasons","verdict","reason_codes","f0_reliability","confidence","annotation","file"];const quote=value=>`"${String(value??"").replaceAll('"','""')}"`;const lines=[fields.map(quote).join(","),...items.map(item=>{const d=saved[item.audit_id]||{};return[item.audit_id,item.slice_set_id,item.candidate_id,item.filename,item.duration_s,item.validator_suggestion,item.validator_reasons.join(";"),d.verdict||"",(d.reasons||[]).join(";"),d.f0_reliability||"",d.confidence||"",d.note||"",item.file].map(quote).join(",")})];const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));link.download="cubase_candidate_audit_E017.csv";link.click()}fetch("manifest.json").then(response=>response.json()).then(data=>{items=data.labels;render()}).catch(error=>{progress.textContent="Could not load E017 sample manifest";console.error(error)});document.querySelectorAll("[data-v]").forEach(button=>button.onclick=()=>setVerdict(button.dataset.v));reasons.onchange=capture;f0.onchange=capture;confidence.onchange=capture;note.oninput=capture;document.getElementById("previous").onclick=()=>move(-1);document.getElementById("skip").onclick=()=>move(1);document.getElementById("next").onclick=()=>move(1);document.getElementById("export").onclick=exportCsv;document.onkeydown=event=>{if(event.target===note||!items.length)return;if(event.code==="Space"){event.preventDefault();candidate.paused?candidate.play():candidate.pause()}if(event.key==="1")setVerdict("usable");if(event.key==="2")setVerdict("unusable");if(event.key==="3")setVerdict("uncertain");if(event.key==="Enter")move(1)};
</script></body></html>
