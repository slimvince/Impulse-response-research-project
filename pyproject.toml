[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-research"
version = "0.1.0"
description = "Unified corpus characterization for double-bass source research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ir-research = "ir_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
